<!DOCTYPE html>
<html lang="eng">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8"> <!--ensuring backward compatibility with ASCII-->
    <meta name="viewport" content="width=device-width, initial-scale=1"> <!--allows all devices to use-->
    <title>guess</title>
</head>
<body>
    <h1>Welcome to guess!</h1>
    <p>There's nothing much here. Still a work in progress.</p>
</body>
<footer>
    <button onclick="showMessage()">No secrets ... yet?</button>
    <div hidden id="msg" class="message">
          Well, lucky you. I guess this counts as a hint then.
          If you don't know your pokemon, the ID number you are looking for is for 'Shuckle'.
    </div>
  
    <div id="timer">00:00:00</div>

    <script>
      function showMessage() {
        const msg = document.getElementById('msg');
        msg.style.display = 'block';
  
        // Hide it again after 6 seconds (6000 ms)
        setTimeout(() => {
          msg.style.display = 'none';
        }, 3000);
      }
      function formatTime(ms) {
        const totalSeconds = Math.floor(ms / 1000);
        const hours = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
        const minutes = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${hours}:${minutes}:${seconds}`;
      }

      const startTime = parseInt(localStorage.getItem('persistent_timer_start_time'), 10);

      function updateTimer() {
          const now = Date.now();
          const elapsed = now - startTime;
          document.getElementById('timer').textContent = formatTime(elapsed);
      }

      setInterval(updateTimer, 1000);
      updateTimer();
    </script>

</footer>
